<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT compaction E2E fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { font: 14px/1.45 system-ui, sans-serif; color: #e8e8e8; background: #212121; }
      #providerSidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 260px;
        min-height: 100vh;
        padding: 16px;
        overflow: auto;
        background: #171717;
      }
      #providerSidebar button { display: block; width: 100%; min-height: 36px; margin: 6px 0; }
      #conversationShell { margin-left: 280px; padding: 24px 24px 150px; }
      #conversation { width: min(820px, 100%); margin: 0 auto; }
      [data-testid^='conversation-turn'] {
        width: 100%;
        min-height: 72px;
        margin: 12px 0;
        padding: 14px;
        border-radius: 12px;
        background: #2f2f2f;
      }
      [data-message-author-role='user'] { color: #fff; }
      [data-message-author-role='assistant'] { color: #e0e0e0; }
      [data-testid='turn-actions'] button { min-width: 70px; min-height: 30px; }
      #composerWrap {
        position: fixed;
        left: 300px;
        right: 32px;
        bottom: 20px;
        display: flex;
        justify-content: center;
      }
      #composer {
        width: min(820px, 100%);
        display: flex;
        gap: 8px;
        padding: 10px;
        border-radius: 14px;
        background: #303030;
      }
      #prompt-textarea { flex: 1; min-height: 68px; padding: 10px; }
      #send-button { width: 84px; min-height: 44px; }
    </style>
  </head>
  <body>
    <aside id="providerSidebar" aria-label="Chat history">
      <button type="button">New chat</button>
      <section aria-label="Chats">
        <h2>Chats</h2>
        <button type="button">Existing chat one</button>
        <button type="button">Existing chat two</button>
        <button type="button">Existing chat three</button>
      </section>
    </aside>

    <div id="conversationShell">
      <main id="conversation" aria-label="Conversation">
        <div data-testid="conversation-turn-1">
          <div data-message-author-role="user">
            <div data-testid="message-content">Initial provider-side fixture turn.</div>
          </div>
          <div data-testid="turn-actions"><button type="button" aria-label="Copy">Copy</button></div>
        </div>
        <div data-testid="conversation-turn-2">
          <div data-message-author-role="assistant">
            <div class="markdown prose">Initial provider-side fixture response.</div>
          </div>
          <div data-testid="turn-actions"><button type="button" aria-label="Copy">Copy</button></div>
        </div>
      </main>
    </div>

    <div id="composerWrap">
      <form id="composer" data-testid="composer" onsubmit="return false">
        <textarea id="prompt-textarea" aria-label="Message ChatGPT" placeholder="Message ChatGPT"></textarea>
        <button id="send-button" type="button" aria-label="Send" data-testid="send-button">Send</button>
      </form>
    </div>

    <script>
      (() => {
        const conversation = document.querySelector('#conversation');
        const input = document.querySelector('#prompt-textarea');
        const sendButton = document.querySelector('#send-button');
        let turn = 2;
        let mode = 'valid';

        const REQUEST_START = '<<<LOCAL_CHAT_COMPACTION_REQUEST_V1>>>';
        const RESPONSE_START = '<<<LOCAL_CHAT_COMPACTION_RESPONSE_V1>>>';
        const RESPONSE_END = '<<<END_LOCAL_CHAT_COMPACTION_RESPONSE_V1>>>';

        function appendTurn(sender, text) {
          turn += 1;
          const wrapper = document.createElement('div');
          wrapper.setAttribute('data-testid', `conversation-turn-${turn}`);

          const role = document.createElement('div');
          role.setAttribute('data-message-author-role', sender === 'me' ? 'user' : 'assistant');
          const content = document.createElement('div');
          if (sender === 'me') content.setAttribute('data-testid', 'message-content');
          else content.className = 'markdown prose';
          content.textContent = text;
          role.appendChild(content);

          const actions = document.createElement('div');
          actions.setAttribute('data-testid', 'turn-actions');
          const copy = document.createElement('button');
          copy.type = 'button';
          copy.setAttribute('aria-label', 'Copy');
          copy.textContent = 'Copy';
          actions.appendChild(copy);

          wrapper.append(role, actions);
          conversation.appendChild(wrapper);
          return wrapper;
        }

        function requestIdFrom(text) {
          return String(text || '').match(/compact:req:[a-zA-Z0-9._:-]+/)?.[0] || '';
        }

        function validResponse(requestId) {
          return [
            RESPONSE_START,
            JSON.stringify({
              protocol: 'local-chat-compaction',
              version: 1,
              requestId,
              compactedMessage:
                'The user is testing Local Chat App compaction end to end. ' +
                'Preserve the verified compaction workflow and continue from the compacted child.'
            }),
            RESPONSE_END
          ].join('\n');
        }

        function malformedResponse(requestId) {
          return [
            RESPONSE_START,
            `{"protocol":"local-chat-compaction","version":1,"requestId":"${requestId}","compactedMessage":`,
            RESPONSE_END
          ].join('\n');
        }

        sendButton.addEventListener('click', () => {
          const text = input.value;
          if (!text.trim()) return;
          input.value = '';
          input.dispatchEvent(new Event('input', { bubbles: true }));
          appendTurn('me', text);

          if (text.includes(REQUEST_START)) {
            const requestId = requestIdFrom(text);
            if (mode === 'hold') return;
            setTimeout(
              () => appendTurn('bot', mode === 'malformed' ? malformedResponse(requestId) : validResponse(requestId)),
              60
            );
            return;
          }

          setTimeout(() => appendTurn('bot', `Continuation response for: ${text}`), 80);
        });

        window.__localChatE2E = {
          setMode(value) {
            mode = String(value || 'valid');
          },
          mode() {
            return mode;
          }
        };
      })();
    </script>
  </body>
</html>
