<main>
  <div data-conversation-screenshot-content class="agent-turn">
    <div class="flex max-w-full flex-col gap-4 grow [&_:is(.result-streaming,.result-thinking)]:[--theme-submit-btn-bg:var(--default-theme-submit-btn-bg)]">
      <div data-message-author-role="assistant" data-message-id="assistant-current" data-turn-start-message="true">
        <div class="flex w-full flex-col gap-1 empty:hidden">
          <div class="markdown prose">Current ChatGPT response captured from the updated layout.</div>
        </div>
      </div>
    </div>
    <div class="z-0 flex min-h-[46px] justify-start">
      <div aria-label="Response actions" role="group">
        <button type="button" aria-label="Copy response" data-testid="copy-turn-action-button">Copy</button>
        <button type="button" aria-label="More actions">More</button>
      </div>
    </div>
  </div>
</main>
