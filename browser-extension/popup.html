<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Chat Saver</title>
    <style>
      body {
        width: 310px;
        margin: 0;
        padding: 14px;
        font:
          13px/1.4 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        padding: 8px;
        font: inherit;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: #fafafa;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: #111827;
        border-color: #111827;
        color: white;
      }
      .hint {
        margin-top: 10px;
        color: #71717a;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #52525b;
      }
      .diagnostics {
        margin-top: 12px;
        border-top: 1px solid #e4e4e7;
        padding-top: 10px;
      }
      .diagnostics h2 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .diagnostics p,
      .diagnostics ul {
        margin: 6px 0 0;
      }
      .diagnostics ul {
        padding-left: 18px;
      }
      .diagnostics code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>Local Chat Saver</h1>
    <label for="localAppUrl">Local app URL</label>
    <input id="localAppUrl" type="url" value="http://localhost:3000" />

    <label for="pairingCode" style="margin-top: 10px">Pairing code</label>
    <input
      id="pairingCode"
      inputmode="text"
      autocomplete="off"
      maxlength="12"
      placeholder="12-character code from Local Chat App"
      aria-describedby="pairingHint"
    />
    <div class="row">
      <button id="save">Save URL</button>
      <button id="pair" class="primary">Pair</button>
      <button id="test">Test</button>
      <button id="diagnose">Diagnose page</button>
    </div>
    <p id="pairingHint" class="hint">
      Generate a short-lived pairing code from the Local Chat App, then enter it here. The extension only connects to
      HTTP loopback addresses.
    </p>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <section id="diagnostics" class="diagnostics" aria-labelledby="diagnosticsTitle" hidden>
      <h2 id="diagnosticsTitle">Provider diagnostics</h2>
      <div id="diagnosticsBody"></div>
    </section>
    <script src="local-api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
